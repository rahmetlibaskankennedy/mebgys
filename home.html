<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SınavRotası - Ana Ekran</title>
<style>
  :root {
    /* Renk Paleti - Prompt'a Uygun */
    --bg-color: #F4F7FB;
    --navy: #153B73;
    --navy-dark: #0A1F3F;
    --red-accent: #E63946;
    --red-light: #FDECEE;
    --white: #FFFFFF;
    --text-main: #1A2639;
    --text-muted: #79879E;
    --card-shadow: 0 10px 30px rgba(21, 59, 115, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  
  body {
    background: #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* Telefon Çerçevesi */
  .phone {
    width: 340px;
    height: 734px;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    background: var(--bg-color);
    border: 10px solid #0B1220;
    box-shadow: 0 25px 70px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
  }

  /* Üst Durum Çubuğu */
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 0; font-size: 13px; font-weight: 600; color: #111;
    z-index: 10;
  }

  /* Kaydırılabilir İçerik Alanı */
  .home-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 100px; /* Alttaki menü için boşluk */
    scrollbar-width: none; /* Firefox */
  }
  .home-content::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  /* Header / Kullanıcı Profili */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    margin-top: 10px;
  }
  .user-info {
    display: flex;
    flex-direction: column;
  }
  .greeting {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .user-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy-dark);
    letter-spacing: -0.5px;
  }
  .profile-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bell-icon {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--card-shadow);
    color: var(--navy-dark);
  }
  .notification-dot {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 6px;
    height: 6px;
    background: var(--red-accent);
    border-radius: 50%;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: var(--card-shadow);
  }

  /* Günlük İlerleme Kartı */
  .progress-card {
    background: var(--navy);
    border-radius: 24px;
    padding: 24px;
    color: var(--white);
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(21, 59, 115, 0.25);
    margin-bottom: 24px;
  }
  .progress-card::after {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .progress-title {
    font-size: 14px;
    font-weight: 500;
    opacity: 0.9;
  }
  .progress-percent {
    font-size: 24px;
    font-weight: 700;
  }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--red-accent); /* İnce kırmızı detay */
    width: 65%;
    border-radius: 10px;
  }
  .progress-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.8;
  }

  /* Pratiğe Başla Butonu */
  .start-practice-btn {
    width: 100%;
    background: var(--white);
    border: none;
    padding: 16px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    margin-bottom: 30px;
    transition: transform 0.2s;
  }
  .start-practice-btn:active {
    transform: scale(0.98);
  }
  .start-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .start-icon-bg {
    width: 48px;
    height: 48px;
    background: var(--red-light);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--red-accent);
  }
  .start-texts {
    text-align: left;
  }
  .start-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy-dark);
  }
  .start-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .start-arrow {
    color: var(--navy);
  }

  /* Kategori Bölümü */
  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--navy-dark);
    margin-bottom: 16px;
  }
  
  .categories-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .category-card {
    background: var(--white);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .cat-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cat-icon.blue { background: #EAF2FF; color: var(--navy); }
  .cat-icon.red { background: var(--red-light); color: var(--red-accent); }
  .cat-icon.dark { background: #F0F4FA; color: var(--navy-dark); }
  
  .cat-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }
  .cat-tasks {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* Alt Navigasyon (Bottom Tab Bar) */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 84px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.03);
    border-radius: 0 0 30px 30px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 10px 20px; /* iPhone home indicator boşluğu */
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .nav-item.active {
    color: var(--navy);
  }
  .nav-item svg {
    width: 24px; height: 24px;
  }
  .nav-item span {
    font-size: 10px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="phone">
  <!-- Status Bar -->
  <div class="statusbar">
    <span>9:41</span>
    <span style="letter-spacing: 1px;">●●● ▲ ▮</span>
  </div>

  <!-- Kaydırılabilir Ana İçerik -->
  <div class="home-content">
    
    <!-- Profil ve Karşılama -->
    <header class="header">
      <div class="user-info">
        <span class="greeting">Merhaba,</span>
        <span class="user-name">Ahmet Yılmaz</span>
      </div>
      <div class="profile-right">
        <div class="bell-icon">
          <div class="notification-dot"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </div>
        <img src="https://i.pravatar.cc/100?img=11" alt="Profil" class="avatar">
      </div>
    </header>

    <!-- Günlük İlerleme Barı -->
    <section class="progress-card">
      <div class="progress-header">
        <span class="progress-title">Günlük Hedef</span>
        <span class="progress-percent">%65</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="progress-footer">
        <span>Çözülen: 130 Soru</span>
        <span>Hedef: 200</span>
      </div>
    </section>

    <!-- Pratiğe Başla Butonu -->
    <button class="start-practice-btn">
      <div class="start-left">
        <div class="start-icon-bg">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M5 3l14 9-14 9V3z"/></svg>
        </div>
        <div class="start-texts">
          <div class="start-title">Hemen Pratiğe Başla</div>
          <div class="start-sub">Kaldığın yerden devam et</div>
        </div>
      </div>
      <div class="start-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
    </button>

    <!-- Modern Konu Kategorileri -->
    <h2 class="section-title">Kategoriler</h2>
    <div class="categories-grid">
      
      <!-- Kategori 1 -->
      <div class="category-card">
        <div class="cat-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        </div>
        <div>
          <div class="cat-title">Mevzuat</div>
          <div class="cat-tasks">12 Alt Konu</div>
        </div>
      </div>

      <!-- Kategori 2 -->
      <div class="category-card">
        <div class="cat-icon red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </div>
        <div>
          <div class="cat-title">Genel Kültür</div>
          <div class="cat-tasks">8 Alt Konu</div>
        </div>
      </div>

      <!-- Kategori 3 -->
      <div class="category-card" style="grid-column: 1 / -1; flex-direction: row; align-items: center;">
        <div class="cat-icon dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div style="flex: 1;">
          <div class="cat-title">MEB Mevzuatı</div>
          <div class="cat-tasks">Tamamlanma: %30</div>
        </div>
        <div class="start-arrow" style="opacity: 0.5;">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>

    </div>
  </div>

  <!-- Alt Navigasyon (Bottom Bar) -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Ana Sayfa</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      <span>Testler</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      <span>Kayıtlar</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profil</span>
    </div>
  </nav>

</div>

</body>
</html>
