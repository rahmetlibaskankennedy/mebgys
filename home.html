  function svgIcon(name, className = 'meta-icon') {
    return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name] || iconPaths.compass}</svg>`;
  }

  function haptic(duration = 20) {
    if ('vibrate' in navigator) {
      navigator.vibrate(duration);
    }
  }

  function openSheet() {
    haptic(20);
    sheet.classList.add('open');
    backdrop.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
  }

  function scaledDistribution(baseDistribution, totalQuestions) {
    const baseTotal = baseDistribution.reduce((sum, item) => sum + item[1], 0);
    const scaled = baseDistribution.map(item => [
      item[0],
      Math.max(1, Math.round((item[1] / baseTotal) * totalQuestions)),
      item[2]
    ]);

    let difference = totalQuestions - scaled.reduce((sum, item) => sum + item[1], 0);
    let index = 0;

    while (difference !== 0) {
      const direction = difference > 0 ? 1 : -1;
      if (scaled[index][1] + direction >= 1) {
        scaled[index][1] += direction;
        difference -= direction;
      }
      index = (index + 1) % scaled.length;
    }

    return scaled;
  }

  function updateCard() {
    const plan = modePlans[selectedMode];
    const distribution = scaledDistribution(plan.distribution, selectedQuestions);
    const minutes = Math.max(5, Math.round(selectedQuestions * 0.9));

    routeBadge.textContent = plan.badge;
    routeCardTitle.textContent = plan.title;
    routeMainIcon.innerHTML = svgIcon(plan.icon, 'ui-icon');
    routeCardSubtitle.textContent = plan.subtitle;

    routePlan.innerHTML = distribution.map(([label, count, dotClass]) => `
      <div class="route-plan-item">
        <span class="route-dot ${dotClass}"></span>
        <span>${label}</span>
        <strong>${count} soru</strong>
      </div>
    `).join('');

    routeQuestionMeta.innerHTML = `${svgIcon('help')}<b>${selectedQuestions} Soru</b>`;
    routeTimeMeta.innerHTML = selectedTime === 'Süresiz'
      ? `${svgIcon('repeat')}<b>Süresiz</b>`
      : `${svgIcon('clock')}<b>${minutes} dk</b>`;
    routeSeriesMeta.innerHTML = selectedMode === 'Zayıf Konular'
      ? `${svgIcon('focus')}<b>Odak puanı</b>`
      : selectedMode === 'Son Çalışılan Konu'
        ? `${svgIcon('history')}<b>Kaldığın yer</b>`
        : `${svgIcon('flame')}<b>Serini koru</b>`;
  }

  function updateSummary() {
    const minutes = selectedTime === 'Süresiz'

    summaryDuration.textContent = minutes;

  }

  function topicSvg(name, className = 'ui-icon') {
    return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${topicIconPaths[name]}</svg>`;
  }

  // Normalize: düz string -> { title } objesine çevir
  function normalizeTopic(topic) {
    return typeof topic === 'string' ? { title: topic } : topic;
  }

  // Bir grubun doğrudan madde yapraklarından oluşup oluşmadığını belirler.
  // Bu bilgi artık görünümü otomatik değiştirmek için değil; liste etiketi ve
  // isteğe bağlı "Sırayla Çalış" modu için kullanılır.
  function isArticleCardGroup(item) {
    return !!item.children && item.children.length > 0 &&
      item.children.every(child => (child.articleNumber || child.articleLabel) && !child.children);
  }

  const ARTICLE_PROGRESS_KEY = 'sinavrotasi.articleProgress.v1';
  let savedArticleProgress = (() => {
    try { return JSON.parse(localStorage.getItem(ARTICLE_PROGRESS_KEY) || '{}'); }
    catch (error) { return {}; }
  })();

  function articleProgressId(item, documentTitle = '') {
    return [documentTitle, item.articleLabel || item.articleNumber || item.title].filter(Boolean).join('::');
  }

  function isArticleCompleted(item, documentTitle = '') {
    return savedArticleProgress[articleProgressId(item, documentTitle)]?.completed === true;
  }

  function setArticleCompleted(item, completed, documentTitle = '') {
    const id = articleProgressId(item, documentTitle);
    savedArticleProgress[id] = { completed, updatedAt: new Date().toISOString() };
    try { localStorage.setItem(ARTICLE_PROGRESS_KEY, JSON.stringify(savedArticleProgress)); }
    catch (error) { /* localStorage kullanılamıyorsa oturum içi durum korunur */ }
  }

  // Şu anki drill-down durumu: kategori + iç içe geçilen madde grubu zinciri
  let currentCategoryKey = null;
  let navStack = []; // her eleman: { title, subtitle, icon, iconClass, topics, progress }
  let swiperState = null; // madde kartı (swipe) modu aktifken: { articles, index, completed, parentLevel, groupTitle }

  function renderDocumentHub(documentItem, parentLevel) {
    swiperState = null;
    topicSheetTitle.textContent = documentItem.title;
    topicSheetSubtitle.textContent = `${documentItem.articleCount || 0} madde • ${documentItem.questionCount || 0} soru`;
    topicEyebrow.textContent = 'MEVZUAT ÇALIŞMA MERKEZİ';

    topicBreadcrumbWrap.innerHTML = `

        <span>${parentLevel.title}</span>
      </div>

    const progress = documentItem.progress || 0;
    topicProgressText.textContent = `%${progress} tamamlandı`;
    topicProgressBar.style.width = `${progress}%`;

    topicList.innerHTML = `
      <section class="document-overview-card">
        <div class="document-overview-top">
          <span class="document-number">${documentItem.documentNumber || 'MEVZUAT'}</span>

        </div>
        <h4>${documentItem.title}</h4>
        <p>Çalışma yöntemini seçebilir veya aşağıdaki bölümlerden doğrudan devam edebilirsin.</p>
        <div class="document-stats">
          <span><strong>${documentItem.articleCount || 0}</strong> madde</span>
          <span><strong>${documentItem.questionCount || 0}</strong> soru</span>
          <span><strong>%${progress}</strong> ilerleme</span>
        </div>
      </section>

      <div class="document-mode-grid">
        <button class="document-mode-card primary" data-document-mode="articles" type="button">
          <span class="document-mode-icon">▤</span>
          <strong>Madde Madde Çalış</strong>
          <small>Bölüm ve madde listesinden istediğin yere git.</small>
        </button>
        <button class="document-mode-card" data-document-mode="sequential" type="button">
          <span class="document-mode-icon">▶</span>
          <strong>Sırayla Öğren</strong>

        <button class="document-mode-card" data-document-mode="questions" type="button">
          <span class="document-mode-icon">?</span>
          <strong>Soru Bankası</strong>
          <small>${documentItem.questionCount || 0} sorudan çalışma seti oluştur.</small>
        </button>
        <button class="document-mode-card" data-document-mode="summary" type="button">
          <span class="document-mode-icon">★</span>
          <strong>Özet ve Kritik Noktalar</strong>
          <small>Sınavda öne çıkan maddeleri hızlı tekrar et.</small>
        </button>
      </div>

      <div class="document-section-head">
        <div>
          <span>KANUN İÇİNDEKİLER</span>
          <strong>Bölüm seçerek devam et</strong>
        </div>
      </div>

      <div class="document-section-list">
        ${documentItem.children.map((section, index) => `
          <article class="document-section-item" data-section-index="${index}" role="button" tabindex="0">
            <span class="document-section-number">${String(index + 1).padStart(2, '0')}</span>
            <div>
              <h4>${section.title}</h4>
              <p>${section.articleRange || 'Madde aralığı hazırlanıyor'}${section.questionCount ? ` • ${section.questionCount} soru` : ''}</p>
            </div>
            <span class="document-section-arrow">›</span>
          </article>
        `).join('')}
      </div>
    `;

    topicSheet.scrollTop = 0;

    const goBack = () => {
      haptic(14);
      renderLevel(parentLevel);
    };
    const backButton = document.getElementById('documentBackBtn');
    backButton.addEventListener('click', goBack);
    backButton.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); goBack(); }
    });

    function openDocumentSections() {
      navStack.push({
        title: documentItem.title,
        subtitle: `${documentItem.children.length} bölüm • ${documentItem.questionCount || 0} soru`,
        icon: 'gavel',
        iconClass: parentLevel.iconClass,
        eyebrow: 'KANUN İÇİNDEKİLER',
        topics: documentItem.children,
        progress,
        documentTitle: documentItem.title,
        documentItem
      });
      renderLevel(navStack[navStack.length - 1]);
    }

    topicList.querySelector('[data-document-mode="articles"]').addEventListener('click', () => {
      haptic(20);
      openDocumentSections();
    });

    topicList.querySelector('[data-document-mode="sequential"]').addEventListener('click', () => {
      const firstReadyGroup = documentItem.children.find(isArticleCardGroup);
      if (!firstReadyGroup) {
        toast.textContent = 'Sıralı çalışma için hazırlanmış madde grubu bulunamadı.';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
        return;
      }
      const articleLevel = {
        title: firstReadyGroup.title,
        subtitle: `${firstReadyGroup.children.length} madde • ${firstReadyGroup.questionCount || 0} soru`,
        icon: 'gavel',
        iconClass: parentLevel.iconClass,
        eyebrow: 'MADDE LİSTESİ',
        topics: firstReadyGroup.children,
        progress: 0,
        isArticleList: true,
        sourceGroup: firstReadyGroup,
        documentTitle: documentItem.title
      };
      navStack.push(articleLevel);
      openArticleSwiper(firstReadyGroup);
    });

    topicList.querySelector('[data-document-mode="questions"]').addEventListener('click', () => {
      haptic(20);
      toast.textContent = `${documentItem.title} soru bankası hazırlanıyor…`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    });

    topicList.querySelector('[data-document-mode="summary"]').addEventListener('click', () => {
      haptic(20);
      toast.textContent = 'Özet ve kritik noktalar ekranı hazırlanıyor…';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    });

    topicList.querySelectorAll('.document-section-item').forEach(element => {
      const openSection = () => {
        const section = documentItem.children[Number(element.dataset.sectionIndex)];
        if (!section.children) {
          toast.textContent = `${section.title} içeriği sonraki aşamada eklenecek.`;
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2200);
          return;
        }
        const articleGroup = isArticleCardGroup(section);
        navStack.push({
          title: section.title,
          subtitle: `${section.children.length} ${articleGroup ? 'madde' : 'bölüm'} • ${section.questionCount || 0} soru`,
          icon: 'gavel',
          iconClass: parentLevel.iconClass,
          eyebrow: articleGroup ? 'MADDE LİSTESİ' : 'MADDE GRUPLARI',
          topics: section.children,
          progress: 0,
          isArticleList: articleGroup,
          sourceGroup: articleGroup ? section : null,
          documentTitle: documentItem.title
        });
        renderLevel(navStack[navStack.length - 1]);
      };
      element.addEventListener('click', openSection);
      element.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openSection(); }
      });
    });
  }

  function renderLevel(level) {
    swiperState = null;
    topicSheetTitle.textContent = level.title;
    topicSheetSubtitle.textContent = level.subtitle;
    topicEyebrow.textContent = level.eyebrow || 'KONU KATEGORİSİ';
    topicHeadingIcon.className = `topic-heading-icon ${level.iconClass || ''}`.trim();
    topicHeadingIcon.innerHTML = topicSvg(level.icon);

    // Breadcrumb: sadece 1. seviyeden derine inildiyse göster
    if (navStack.length > 1) {
      const parentLevel = navStack[navStack.length - 2];
      topicBreadcrumbWrap.innerHTML = `
        <div class="topic-breadcrumb" id="topicBackBtn" role="button" tabindex="0">
          ${topicSvg('back')}
          <span>${parentLevel.title}</span>
        </div>
      `;
      const backBtn = document.getElementById('topicBackBtn');
      const goBack = () => {
        haptic(14);
        navStack.pop();
        renderLevel(navStack[navStack.length - 1]);
      };
      backBtn.addEventListener('click', goBack);
      backBtn.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goBack(); }
      });
    } else {
      topicBreadcrumbWrap.innerHTML = '';
    }

    const items = level.topics.map(normalizeTopic);
    const articleItems = items.filter(item => item.articleNumber || item.articleLabel);
    const persistedCompletedCount = articleItems.filter(item => isArticleCompleted(item, level.documentTitle)).length;
    const progress = level.isArticleList && articleItems.length
      ? Math.round((persistedCompletedCount / articleItems.length) * 100)
      : (level.progress || 0);
    topicProgressText.textContent = progress ? `%${progress} tamamlandı` : 'Henüz çalışılmadı';
    topicProgressBar.style.width = `${progress}%`;

    const completedCount = Math.floor((progress / 100) * items.length);
    const toolbar = level.isArticleList ? `
      <div class="article-list-toolbar">
        <div>
          <strong>${articleItems.length} maddeyi sırayla çalış</strong>
          <span>Liste görünümünü korur; kart modu yalnızca sen başlatınca açılır.</span>
        </div>
        <button class="article-study-button" id="startSequentialStudy" type="button">Sırayla Çalış</button>
      </div>
    ` : '';

    topicList.innerHTML = toolbar + items.map((item, index) => {
      const completed = (item.articleNumber || item.articleLabel)
        ? isArticleCompleted(item, level.documentTitle)
        : (index < completedCount && !item.children);
      const hasChildren = !!item.children;
      const childLabel = isArticleCardGroup(item) ? 'madde' : 'bölüm';
      const metaLine = hasChildren
        ? `${item.children.length} ${childLabel}${item.questionCount ? ` • ${item.questionCount} soru` : ''}`
        : (completed ? 'Tamamlandı' : (item.articleRange ? '' : 'Konu anlatımı ve soru bankası'));

      return `
        <article class="topic-item ${completed ? 'completed' : ''} ${hasChildren ? 'has-children' : ''}" data-index="${index}" role="button" tabindex="0">
          <div class="topic-number">${completed ? '✓' : String(index + 1).padStart(2, '0')}</div>
          <div class="topic-copy">
            <h4>${item.title}</h4>
            ${item.articleRange ? `<span class="article-range">${item.articleRange}</span>` : ''}
            ${item.articleLabel ? `<span class="article-range">${item.articleLabel}</span>` : ''}
            ${metaLine ? `<p>${metaLine}</p>` : ''}
          </div>
          ${hasChildren
            ? `<span class="topic-count-pill">${item.children.length}</span>`
            : ''}
        </article>
      `;
    }).join('');

    // Has-children satırların sonuna ok ikonunu ayrı ekle (pill'den sonra)
    topicList.querySelectorAll('.topic-item.has-children').forEach(el => {
      el.insertAdjacentHTML('beforeend', `<div class="topic-arrow">${topicSvg('arrow')}</div>`);
      el.style.gridTemplateColumns = '36px minmax(0,1fr) auto 18px';
    });
    topicList.querySelectorAll('.topic-item:not(.has-children)').forEach(el => {
      el.insertAdjacentHTML('beforeend', `<div class="topic-arrow">${topicSvg('arrow')}</div>`);
    });

    topicSheet.scrollTop = 0;

    const sequentialButton = document.getElementById('startSequentialStudy');
    if (sequentialButton && level.sourceGroup) {
      sequentialButton.addEventListener('click', () => {
        haptic(20);
        openArticleSwiper(level.sourceGroup);
      });
    }

    topicList.querySelectorAll('.topic-item').forEach(el => {
      const index = Number(el.dataset.index);
      const item = items[index];

      const activate = () => {
        if (item.children) {
          haptic(20);
          const currentLevel = navStack[navStack.length - 1];
          if (item.type === 'document') {
            renderDocumentHub(item, currentLevel);
            return;
          }
          const articleGroup = isArticleCardGroup(item);
          navStack.push({
            title: item.title,
            subtitle: articleGroup
              ? `${item.children.length} madde • ${item.questionCount || item.children.reduce((s, c) => s + (c.questionCount || 0), 0)} soru`
              : `${item.children.length} bölüm • toplam ${item.questionCount || item.children.reduce((s, c) => s + (c.questionCount || 0), 0)} soru`,
            icon: 'gavel',
            iconClass: currentLevel.iconClass,
            eyebrow: articleGroup ? 'MADDE LİSTESİ' : 'MADDE GRUPLARI',
            topics: item.children,
            progress: 0,
            isArticleList: articleGroup,
            sourceGroup: articleGroup ? item : null,
            documentTitle: currentLevel.documentTitle || (item.title.includes('sayılı') ? item.title : '')
          });
          renderLevel(navStack[navStack.length - 1]);
        } else if (item.articleNumber || item.articleLabel) {
          haptic(18);
          renderArticleDetail(item);
        } else {
          haptic(18);
          toast.textContent = `${item.title} açılıyor…`;
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2200);
          // Gerçek uygulamada:
          // topicStore.setSelectedTopic(item);
          // router.navigate('/topic-detail');
        }
      };

      el.addEventListener('click', activate);
      el.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate();
        }
      });
    });
  }


  function renderArticleDetail(item) {
    swiperState = null;
    topicSheetTitle.textContent = item.title;
    topicSheetSubtitle.textContent = `${item.articleLabel || 'Kanun maddesi'} • 222 sayılı Kanun`;
    topicEyebrow.textContent = 'MADDE OKUYUCU';
    topicHeadingIcon.className = 'topic-heading-icon red';
    topicHeadingIcon.innerHTML = topicSvg('gavel');

    const parentLevel = navStack[navStack.length - 1];
    topicBreadcrumbWrap.innerHTML = `
      <div class="topic-breadcrumb" id="articleBackBtn" role="button" tabindex="0">
        ${topicSvg('back')}
        <span>${parentLevel.title}</span>
      </div>
    `;
    const goBack = () => { haptic(14); renderLevel(parentLevel); };
    const backButton = document.getElementById('articleBackBtn');
    backButton.addEventListener('click', goBack);
    backButton.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); goBack(); }
    });

    const completed = isArticleCompleted(item, parentLevel.documentTitle);
    topicProgressText.textContent = completed ? 'Tamamlandı' : 'Okunmayı bekliyor';
    topicProgressBar.style.width = completed ? '100%' : '0%';

    const officialSections = item.officialText?.sections || [];
    const keyPoints = item.keyPoints?.length ? item.keyPoints : ['Resmî metni dikkatle incele.'];

    topicList.innerHTML = `
      <div class="article-reader">
        <section class="reader-hero">
          <div class="article-kicker">
            <span class="article-label">${item.articleLabel || ''}</span>
            <span class="article-status">222 SAYILI KANUN</span>
          </div>
          <h4>${item.title}</h4>
          <p>Uzun maddeler sekmeli okuyucuda, fıkra ve bentler korunarak gösterilir.</p>
        </section>

        <div class="reader-tabs" role="tablist">
          <button class="reader-tab active" data-tab="summary" type="button">Sade Anlatım</button>
          <button class="reader-tab" data-tab="official" type="button">Resmî Metin</button>
          <button class="reader-tab" data-tab="points" type="button">Kritik Noktalar</button>
        </div>

        <section class="reader-panel active" data-panel="summary">
          <div class="reader-card">
            <span class="reader-card-label">KISA ÖZET</span>
            <p>${item.summary || 'Bu madde için sade anlatım hazırlanıyor.'}</p>
          </div>
          <div class="reader-info">
            Kart modunda yalnızca bu kısa özet gösterilir. Maddenin tamamı “Resmî Metin” sekmesinde dikey kaydırılır.
          </div>
        </section>

        <section class="reader-panel" data-panel="official">
          <div class="official-toolbar">
            <strong>Eksiksiz kanun metni</strong>
            <div>
              <button id="fontDown" type="button" aria-label="Yazıyı küçült">A−</button>
              <button id="fontUp" type="button" aria-label="Yazıyı büyüt">A+</button>
            </div>
          </div>
          <div class="official-text" id="officialText">
            ${officialSections.map((section, index) => `
              <article class="official-section">
                ${officialSections.length > 1 ? `<span>${section.label}</span>` : ''}
                <p>${section.text}</p>
              </article>
            `).join('')}
          </div>
        </section>

        <section class="reader-panel" data-panel="points">
          <div class="reader-card">
            <span class="reader-card-label">SINAV ODAKLI NOTLAR</span>
            <ul class="article-points">${keyPoints.map(point => `<li>${point}</li>`).join('')}</ul>
          </div>
        </section>

        <div class="reader-actions">
          <button class="reader-secondary" id="articleQuestionsBtn" type="button">Madde Soruları</button>
          <button class="reader-primary ${completed ? 'done' : ''}" id="articleCompleteBtn" type="button">
            ${completed ? '✓ Tamamlandı' : 'Tamamlandı İşaretle'}
          </button>
        </div>
      </div>
    `;

    document.querySelectorAll('.reader-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.reader-tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.reader-panel').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
      });
    });

    let fontSize = 15;
    const officialText = document.getElementById('officialText');
    document.getElementById('fontDown').addEventListener('click', () => {
      fontSize = Math.max(13, fontSize - 1); officialText.style.fontSize = `${fontSize}px`;
    });
    document.getElementById('fontUp').addEventListener('click', () => {
      fontSize = Math.min(21, fontSize + 1); officialText.style.fontSize = `${fontSize}px`;
    });

    document.getElementById('articleCompleteBtn').addEventListener('click', () => {
      const isDone = isArticleCompleted(item, parentLevel.documentTitle);
      setArticleCompleted(item, parentLevel.documentTitle, !isDone);
      renderArticleDetail(item);
    });
    document.getElementById('articleQuestionsBtn').addEventListener('click', () => {
      toast.textContent = `${item.articleLabel} soru modülü hazırlanıyor.`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    });
  }


  function openArticleSwiper(group) {
    const parentLevel = navStack[navStack.length - 1];
    const completedIndexes = new Set();
    group.children.forEach((article, index) => {
      if (isArticleCompleted(article, parentLevel.documentTitle)) completedIndexes.add(index);
    });
    swiperState = {
      articles: group.children,
      index: 0,
      completed: completedIndexes,
      parentLevel,
      groupTitle: group.title,
      groupIconClass: parentLevel.iconClass,
      documentTitle: parentLevel.documentTitle
    };
    renderSwiperCard();
  }

  function renderSwiperCard(direction) {
    const { articles, index, completed, parentLevel, groupTitle } = swiperState;
    const item = articles[index];
    const isLast = index === articles.length - 1;
    const isDone = completed.has(index);

    topicEyebrow.textContent = 'MADDE KARTI';
    topicHeadingIcon.className = 'topic-heading-icon';
    topicHeadingIcon.innerHTML = topicSvg('gavel');
    topicSheetTitle.textContent = groupTitle;
    topicSheetSubtitle.textContent = `Madde ${index + 1} / ${articles.length}`;

    topicBreadcrumbWrap.innerHTML = `
      <div class="topic-breadcrumb" id="swiperBackBtn" role="button" tabindex="0">
        ${topicSvg('back')}
        <span>${parentLevel.title}</span>
      </div>
    `;
    const backBtn = document.getElementById('swiperBackBtn');
    const goBackToParent = () => {
      haptic(14);
      swiperState = null;
      renderLevel(parentLevel);
    };
    backBtn.addEventListener('click', goBackToParent);
    backBtn.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goBackToParent(); }
    });

    const completedCount = completed.size;
    const progress = Math.round((completedCount / articles.length) * 100);
    topicProgressText.textContent = completedCount === 0 ? 'Henüz çalışılmadı' : `%${progress} tamamlandı`;
    topicProgressBar.style.width = `${progress}%`;

    const keyPoints = item.keyPoints && item.keyPoints.length
      ? item.keyPoints
      : ['Madde başlığını öğren', 'Temel kavramları ayırt et', 'Madde sorularıyla pekiştir'];

    topicList.innerHTML = `
      <div class="swiper-position">
        <strong>Madde ${index + 1} / ${articles.length}</strong>
        <div class="swiper-position-track"><span style="width:${((index + 1) / articles.length) * 100}%"></span></div>
      </div>

      <div class="article-swiper-track" id="swiperTrack">
        <article class="article-detail-card swiper-card ${direction ? 'enter-' + direction : ''}" id="swiperCard">
          <div class="article-kicker">
            <span class="article-label">${item.articleLabel || `Madde ${item.articleNumber || ''}`}</span>
            <button class="article-toggle-complete ${isDone ? 'done' : ''}" id="swiperToggleComplete" type="button">
              ${isDone ? topicSvg('check', 'choice-icon') : ''}<span>${isDone ? 'Tamamlandı' : 'Tamamlandı İşaretle'}</span>
            </button>
          </div>
          <h4>${item.title}</h4>
          <p>${item.summary || 'Bu maddeye ilişkin kısa açıklama daha sonra içerik yönetim sisteminden getirilecektir.'}</p>
        </article>
      </div>

      <div class="article-demo-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5"></path>
          <path d="M12 8h.01"></path>
        </svg>
        <span>Bu ekran kurgu amaçlıdır. Resmî madde hükmü sonraki aşamada doğrulanmış mevzuat kaynağından otomatik olarak yüklenecektir.</span>
      </div>

      <div class="article-tabs" role="tablist">
        <button class="article-tab active" data-article-tab="explanation" type="button">Sade Anlatım</button>
        <button class="article-tab" data-article-tab="official" type="button">Kanun Metni</button>
        <button class="article-tab" data-article-tab="points" type="button">Önemli Noktalar</button>
      </div>

      <section class="article-panel" id="swiperPanel">
        <h5>Sade Anlatım</h5>
        <p>${item.summary || 'Madde açıklaması içerik sistemi bağlandığında burada gösterilecektir.'}</p>
      </section>

      <div class="article-actions">
        <button class="article-action secondary" id="swiperSolveBtn" type="button">${item.questionCount || 0} Madde Sorusunu Çöz</button>
        <button class="article-action primary" id="swiperNextBtn" type="button">${isLast ? 'Listeye Dön' : 'Sıradaki Madde ›'}</button>
      </div>
      <div class="article-nav-actions">
        <button id="swiperPrevBtn" type="button" ${index === 0 ? 'disabled' : ''}>‹ Önceki Madde</button>
        <button id="swiperVisibleNextBtn" type="button">${isLast ? 'Listeye Dön' : 'Sonraki Madde ›'}</button>
      </div>
    `;

    topicSheet.scrollTop = 0;

    // Kart giriş animasyonunu tetikle (varsa)
    if (direction) {
      const cardEl = document.getElementById('swiperCard');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          cardEl.classList.remove('enter-next', 'enter-prev');
        });
      });
    }

    // Sekmeler
    const panel = document.getElementById('swiperPanel');
    const tabs = topicList.querySelectorAll('.article-tab');
    function showTab(tabName) {
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.articleTab === tabName));
      if (tabName === 'official') {
        panel.innerHTML = `
          <h5>Resmî Kanun Metni</h5>
          <p>Resmî hüküm metni henüz bu prototipe eklenmedi. Üretim aşamasında doğrulanmış mevzuat dosyasından veya içerik servisinden getirilecek.</p>
        `;
      } else if (tabName === 'points') {
        panel.innerHTML = `
          <h5>Önemli Noktalar</h5>
          <ul>${keyPoints.map(point => `<li>${point}</li>`).join('')}</ul>
        `;
      } else {
        panel.innerHTML = `
          <h5>Sade Anlatım</h5>
          <p>${item.summary || 'Madde açıklaması içerik sistemi bağlandığında burada gösterilecektir.'}</p>
        `;
      }
    }
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        haptic(10);
        showTab(tab.dataset.articleTab);
      });
    });

    // Tamamlandı işaretle (kaydırmadan, mevcut kartta kal)
    document.getElementById('swiperToggleComplete').addEventListener('click', () => {
      haptic(16);
      if (swiperState.completed.has(swiperState.index)) {
        swiperState.completed.delete(swiperState.index);
        setArticleCompleted(item, false, swiperState.documentTitle);
      } else {
        swiperState.completed.add(swiperState.index);
        setArticleCompleted(item, true, swiperState.documentTitle);
      }
      renderSwiperCard();
    });

    // Soruları çöz (sol taraf)
    document.getElementById('swiperSolveBtn').addEventListener('click', () => {
      haptic(20);
      toast.textContent = `${item.articleLabel} için ${item.questionCount || 0} soruluk çalışma açılıyor…`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2300);
    });

    // Sıradaki madde (sağ taraf) — geçince otomatik tamamlandı işaretlenir
    document.getElementById('swiperNextBtn').addEventListener('click', () => {
      haptic(24);
      advanceSwiper();
    });

    document.getElementById('swiperPrevBtn').addEventListener('click', () => {
      if (swiperState.index <= 0) return;
      haptic(16);
      goToIndex(swiperState.index - 1, 'prev');
    });
    document.getElementById('swiperVisibleNextBtn').addEventListener('click', () => {
      haptic(18);
      advanceSwiper();
    });

    attachSwipeHandlers();
  }

  function advanceSwiper() {
    const { index, articles, parentLevel } = swiperState;

    if (index >= articles.length - 1) {
      toast.textContent = 'Sıralı çalışma tamamlandı. Madde listesine dönülüyor…';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2300);
      swiperState = null;
      renderLevel(parentLevel);
      return;
    }

    goToIndex(index + 1, 'next');
  }

  function goToIndex(newIndex, direction) {
    const card = document.getElementById('swiperCard');
    if (!card) {
      swiperState.index = newIndex;
      renderSwiperCard(direction);
      return;
    }

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      swiperState.index = newIndex;
      renderSwiperCard(direction);
    };

    card.style.transform = '';
    card.style.opacity = '';
    card.classList.add(direction === 'next' ? 'exit-next' : 'exit-prev');
    card.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 300);
  }

  function attachSwipeHandlers() {
    const card = document.getElementById('swiperCard');
    if (!card) return;

    let dragging = false;
    let startX = 0;
    let deltaX = 0;
    let pointerId = null;

    const onDown = event => {
      dragging = true;
      pointerId = event.pointerId;
      startX = event.clientX;
      deltaX = 0;
      card.style.transition = 'none';
      try { card.setPointerCapture(pointerId); } catch (e) { /* no-op */ }
    };

    const onMove = event => {
      if (!dragging) return;
      deltaX = event.clientX - startX;
      card.style.transform = `translateX(${deltaX}px) rotate(${deltaX / 40}deg)`;
      card.style.opacity = String(Math.max(1 - Math.abs(deltaX) / 260, 0.4));
    };

    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      card.style.transition = '';
      const threshold = 70;

      if (deltaX <= -threshold) {
        // Sola kaydırma: sıradaki maddeye geç; tamamlanma yalnızca kullanıcı seçimiyle kaydedilir
        haptic(16);
        card.style.transform = '';
        card.style.opacity = '';
        advanceSwiper();
      } else if (deltaX >= threshold && swiperState.index > 0) {
        haptic(16);
        card.style.transform = '';
        card.style.opacity = '';
        goToIndex(swiperState.index - 1, 'prev');
      } else {
        card.style.transform = '';
        card.style.opacity = '';
      }
    };

    card.addEventListener('pointerdown', onDown);
    card.addEventListener('pointermove', onMove);
    card.addEventListener('pointerup', onUp);
    card.addEventListener('pointercancel', onUp);
  }

  function openTopicSheet(categoryKey) {
    const category = categoryTopics[categoryKey];
    if (!category) return;

    haptic(20);
    currentCategoryKey = categoryKey;
    navStack = [{
      title: category.title,
      subtitle: category.subtitle,
      icon: category.icon,
      iconClass: category.iconClass,
      eyebrow: 'KONU KATEGORİSİ',
      topics: category.topics,
      progress: category.progress
    }];

    renderLevel(navStack[0]);

    topicSheet.classList.add('open');
    topicBackdrop.classList.add('open');
    topicSheet.setAttribute('aria-hidden', 'false');
  }

  function closeTopicSheet() {
    topicSheet.classList.remove('open');
    topicBackdrop.classList.remove('open');
    topicSheet.setAttribute('aria-hidden', 'true');
  }

  document.querySelectorAll('.category[data-category]').forEach(card => {
    const activateCategory = (event) => {
      if (event) event.stopPropagation();
      openTopicSheet(card.getAttribute('data-category'));
    };

    card.addEventListener('click', activateCategory);
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateCategory(event);
      }
    });
  });

  closeTopicSheetButton.addEventListener('click', () => {
    haptic(12);
    closeTopicSheet();
  });

  topicBackdrop.addEventListener('click', closeTopicSheet);


  updateSummary();
  updateCard();
})();
</script>

</body>
</html>
