<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SınavRotası — Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <div id="authGate">Yükleniyor…</div>

  <div id="adminApp">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>SınavRotası Admin</h1>
        <div class="who"><span id="adminEmail"></span><button id="signOutBtn" type="button">Çıkış</button></div>
      </div>
      <div class="tabs">
        <button type="button" class="active" data-tab="questions">Sorular</button>
        <button type="button" data-tab="denemeler">Denemeler</button>
        <button type="button" data-tab="topics">Konular</button>
      </div>
      <div class="side-panel" id="sidePanel"><div class="empty-state">Yükleniyor…</div></div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h2 id="mainTitle">Bir konu seçin</h2>
          <div class="sub" id="mainSub"></div>
        </div>
        <div id="mainActions">
          <button class="btn" id="newQuestionBtn" disabled type="button">+ Yeni Soru</button>
        </div>
      </div>
      <div class="content" id="content">
        <div class="empty-state">Soldan bir konu seçerek sorularını görüntüleyin.</div>
      </div>
    </main>
  </div>

  <!-- Soru ekle/düzenle modalı -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3 id="modalTitle">Yeni Soru</h3>
      <form id="questionForm">
        <div class="field">
          <label>Konu</label>
          <select id="fTopic" required></select>
        </div>
        <div class="field">
          <label>Soru metni</label>
          <textarea id="fPrompt" required></textarea>
        </div>
        <div class="field">
          <label>Şıklar (doğru olanı işaretleyin)</label>
          <div class="option-row"><input type="radio" name="fCorrect" value="0" checked><input type="text" id="fOpt0" required placeholder="A şıkkı"></div>
          <div class="option-row"><input type="radio" name="fCorrect" value="1"><input type="text" id="fOpt1" required placeholder="B şıkkı"></div>
          <div class="option-row"><input type="radio" name="fCorrect" value="2"><input type="text" id="fOpt2" required placeholder="C şıkkı"></div>
          <div class="option-row"><input type="radio" name="fCorrect" value="3"><input type="text" id="fOpt3" required placeholder="D şıkkı"></div>
        </div>
        <div class="field">
          <label>Açıklama (opsiyonel)</label>
          <textarea id="fExplanation"></textarea>
        </div>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="modalCancelBtn">Vazgeç</button>
          <button type="submit" class="btn" id="modalSaveBtn">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Deneme ekle/düzenle modalı -->
  <div class="modal-backdrop" id="denemeModalBackdrop">
    <div class="modal">
      <h3 id="denemeModalTitle">Yeni Deneme</h3>
      <form id="denemeForm">
        <div class="field">
          <label>Başlık</label>
          <input type="text" id="dTitle" required placeholder="Örn. Şef Denemesi #1">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Kadro</label>
            <select id="dKadro" required></select>
          </div>
          <div class="field">
            <label>Süre (dakika)</label>
            <input type="number" id="dDuration" min="1" required>
          </div>
        </div>
        <div class="field field-check">
          <input type="checkbox" id="dPublished">
          <label for="dPublished" style="margin:0;">Yayında (kullanıcılar görebilir)</label>
        </div>
        <div class="form-hint" id="denemeQuestionInfo"></div>
        <div class="form-error" id="denemeFormError"></div>
        <div class="modal-actions split">
          <button type="button" class="btn secondary" id="regenerateBtn" style="display:none;">Soruları Yeniden Oluştur</button>
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn secondary" id="denemeModalCancelBtn">Vazgeç</button>
            <button type="submit" class="btn" id="denemeModalSaveBtn">Kaydet</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Konu ekle/düzenle modalı -->
  <div class="modal-backdrop" id="topicModalBackdrop">
    <div class="modal">
      <h3 id="topicModalTitle">Yeni Konu</h3>
      <div class="form-hint" id="topicParentHint" style="margin-bottom:10px;"></div>
      <form id="topicForm">
        <div class="field">
          <label>Başlık</label>
          <input type="text" id="tTitle" required placeholder="Örn. Devlet Memurları Kanunu">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Tür</label>
            <select id="tType">
              <option value="topic">Konu</option>
              <option value="document">Kanun / Belge</option>
              <option value="section">Bölüm</option>
            </select>
          </div>
          <div class="field">
            <label>Soru hedefi (opsiyonel)</label>
            <input type="number" id="tQuestionCount" min="0">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Kanun numarası (opsiyonel)</label>
            <input type="text" id="tDocNumber" placeholder="Örn. 657">
          </div>
          <div class="field">
            <label>Madde aralığı (opsiyonel)</label>
            <input type="text" id="tArticleRange" placeholder="Örn. 1-15">
          </div>
        </div>
        <div class="field">
          <label>Geçerli kadrolar</label>
          <div class="kadro-check-group" id="tKadroGroup"></div>
        </div>
        <div class="form-error" id="topicFormError"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="topicModalCancelBtn">Vazgeç</button>
          <button type="submit" class="btn" id="topicModalSaveBtn">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Kategori ekle/düzenle modalı -->
  <div class="modal-backdrop" id="categoryModalBackdrop">
    <div class="modal">
      <h3 id="categoryModalTitle">Yeni Kategori</h3>
      <form id="categoryForm">
        <div class="field">
          <label>Başlık</label>
          <input type="text" id="cTitle" required placeholder="Örn. Genel Yetenek">
        </div>
        <div class="field">
          <label>Alt başlık (opsiyonel)</label>
          <input type="text" id="cSubtitle" placeholder="Örn. Türkçe, Matematik, Tarih...">
        </div>
        <div class="form-error" id="categoryFormError"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="categoryModalCancelBtn">Vazgeç</button>
          <button type="submit" class="btn" id="categoryModalSaveBtn">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="admin.js"></script>
</body>
</html>
