<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SınavRotası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= AUTH CONTAINER (KULLANICI GİRİŞ / KAYIT) ================= -->
  <main class="auth-wrapper" id="authContainer">
    <div class="auth-card-box">
      
      <!-- Marka Logosu -->
      <header class="auth-brand">
        <img class="auth-brand-icon" src="images/logo-icon.png" alt="SınavRotası" width="64" height="64">
        <h1 class="auth-brand-word"><span class="w-navy">Sınav</span><span class="w-red">Rotası</span></h1>
        <p class="auth-brand-tag">Kariyer Yolculuğuna Yön Ver</p>
      </header>

      <!-- Sekme Anahtarı (Tabs) -->
      <nav class="auth-tabs" aria-label="Kimlik Doğrulama Seçenekleri">
        <button class="auth-tab active" id="tabLogin" type="button">Giriş Yap</button>
        <button class="auth-tab" id="tabSignup" type="button">Kayıt Ol</button>
      </nav>

      <!-- GİRİŞ FORMU -->
      <section class="auth-card" id="loginCard">
        <div class="auth-heading">
          <h2>Tekrar Hoş Geldin!</h2>
          <p>Yolculuğuna devam etmek için giriş yap.</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            <input type="email" id="loginEmail" placeholder="E-posta Adresi" autocomplete="email" required>
          </div>

          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="loginPassword" placeholder="Şifre" autocomplete="current-password" required>
            <svg class="eye" data-toggle-for="loginPassword" viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>

          <div class="row-between">
            <label class="remember"><input type="checkbox" id="rememberMe"> Beni hatırla</label>
            <button type="button" class="forgot-btn" id="forgotPasswordLink">Şifremi Unuttum?</button>
          </div>

          <p class="auth-error" id="loginError" aria-live="polite"></p>
          <button class="primary-btn" type="submit" id="loginSubmit">Giriş Yap</button>
        </form>

        <div class="divider"><div class="line"></div><span>veya şununla devam et</span><div class="line"></div></div>
        
        <div class="socials">
          <button class="social-box" type="button" data-provider="google" aria-label="Google ile Giriş Yap">
            <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.5-6.5C35.3 2.6 30 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.6 5.9C12.1 13 17.5 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 2.9-2.2 5.4-4.7 7.1l7.3 5.7c4.3-4 6.8-9.9 6.8-17.3z"/><path fill="#FBBC05" d="M10.1 19.1a14.5 14.5 0 0 0 0 9.7l-7.6 5.9a24 24 0 0 1 0-21.5z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.3-5.7c-2 1.4-4.7 2.2-8.7 2.2-6.5 0-12-4.4-13.9-10.3l-7.6 5.9C6.5 42.6 14.6 48 24 48z"/></svg>
            <span>Google</span>
          </button>
          <button class="social-box" type="button" data-provider="azure" aria-label="Microsoft / Hotmail ile Giriş Yap">
            <svg viewBox="0 0 48 48"><rect x="4" y="4" width="18" height="18" fill="#F25022"/><rect x="26" y="4" width="18" height="18" fill="#7FBA00"/><rect x="4" y="26" width="18" height="18" fill="#00A4EF"/><rect x="26" y="26" width="18" height="18" fill="#FFB900"/></svg>
            <span>Microsoft</span>
          </button>
        </div>
      </section>

      <!-- KAYIT FORMU -->
      <section class="auth-card" id="signupCard" style="display: none;">
        <div class="auth-heading">
          <h2>Hesap Oluştur</h2>
          <p>SınavRotası'na katıl ve başarı yolculuğuna başla.</p>
        </div>

        <form id="signupForm" class="auth-form" novalidate>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            <input type="text" id="signupName" placeholder="Ad Soyad" autocomplete="name" required>
          </div>

          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="email" id="signupEmail" placeholder="E-posta Adresi" autocomplete="email" required>
          </div>

          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="signupPassword" placeholder="Şifre (en az 6 karakter)" autocomplete="new-password" required minlength="6">
            <svg class="eye" data-toggle-for="signupPassword" viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>

          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="signupPasswordConfirm" placeholder="Şifreyi Onayla" autocomplete="new-password" required minlength="6">
            <svg class="eye" data-toggle-for="signupPasswordConfirm" viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>

          <div class="terms">
            <input type="checkbox" id="signupTerms" required>
            <label for="signupTerms">Kullanım Koşulları ve Gizlilik Politikası'nı kabul ediyorum</label>
          </div>

          <p class="auth-error" id="signupError" aria-live="polite"></p>
          <p class="auth-info" id="signupInfo" aria-live="polite"></p>

          <button class="primary-btn" type="submit" id="signupSubmit">Kayıt Ol</button>
        </form>

        <div class="divider"><div class="line"></div><span>veya şununla kayıt ol</span><div class="line"></div></div>

        <div class="socials">
          <button class="social-box" type="button" data-provider="google" aria-label="Google ile Kayıt Ol">
            <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.5-6.5C35.3 2.6 30 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.6 5.9C12.1 13 17.5 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 2.9-2.2 5.4-4.7 7.1l7.3 5.7c4.3-4 6.8-9.9 6.8-17.3z"/><path fill="#FBBC05" d="M10.1 19.1a14.5 14.5 0 0 0 0 9.7l-7.6 5.9a24 24 0 0 1 0-21.5z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.3-5.7c-2 1.4-4.7 2.2-8.7 2.2-6.5 0-12-4.4-13.9-10.3l-7.6 5.9C6.5 42.6 14.6 48 24 48z"/></svg>
            <span>Google</span>
          </button>
          <button class="social-box" type="button" data-provider="azure" aria-label="Microsoft / Hotmail ile Kayıt Ol">
            <svg viewBox="0 0 48 48"><rect x="4" y="4" width="18" height="18" fill="#F25022"/><rect x="26" y="4" width="18" height="18" fill="#7FBA00"/><rect x="4" y="26" width="18" height="18" fill="#00A4EF"/><rect x="26" y="26" width="18" height="18" fill="#FFB900"/></svg>
            <span>Microsoft</span>
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- ================= UYGULAMA EKRANI (GİRİŞ SONRASI) ================= -->
  <div id="appPhone" style="display: none;">
    <!-- Uygulama arayüzü app.js tarafından render edilecek -->
    <div id="app"></div>
  </div>

  <!-- SCRIPT YÜKLEME SIRASI -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
