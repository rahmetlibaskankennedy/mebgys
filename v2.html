  7:{title:'İlköğretimin yapısı',summary:'İlköğretim; dört yıl zorunlu ilkokul ve dört yıl zorunlu ortaokuldan oluşur.',points:['4 yıl ilkokul','4 yıl ortaokul','Her iki kademe de zorunludur.'],official:'İlköğretim; 1 inci maddede belirtilen amacı gerçekleştirmek için kurulmuş dört yıl süreli ve zorunlu ilkokul ile dört yıl süreli ve zorunlu ortaokuldan oluşan bir Milli Eğitim ve Öğretim Kurumudur.'},

 {id:11,article:54,section:'attendance',q:'Kanunda belirtilen özel nedenlerle bir öğrenciye bir yıl içinde en fazla kaç gün izin verilebilir?',choices:['10','15','20','30'],answer:1,explain:'Madde 54, okul yönetimince verilecek izni bir yıl içinde en fazla 15 günle sınırlar.'},
 {id:12,article:61,section:'land',q:'Belirli umuma açık yerler ile okul binaları arasında kapıdan kapıya bulunması gereken asgari mesafe kaç metredir?',choices:['50','75','100','200'],answer:2,explain:'Madde 61’e göre asgari mesafe kapıdan kapıya 100 metredir.'}

const state = {
  view:'home', quiz:[], index:0, answers:[], wrong:new Set(JSON.parse(localStorage.getItem('sr-wrong')||'[]')),
  articleTab:'summary', selectedSection:null
};

const app = document.getElementById('app');
const toast = document.getElementById('toast');
const navButtons=[...document.querySelectorAll('[data-nav]')];

function showToast(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function saveWrong(){localStorage.setItem('sr-wrong',JSON.stringify([...state.wrong]))}
function icon(name){const map={play:'▶',bolt:'⚡',wrong:'✕',law:'§',book:'▦',chart:'↗',arrow:'›',check:'✓'};return map[name]||'•'}
function setNav(name){navButtons.forEach(b=>b.classList.toggle('active',b.dataset.nav===name))}
function go(view){state.view=view;setNav(view==='quiz'||view==='result'?'bank':view);render();app.scrollTop=0}

function homeView(){
 const wrongCount=state.wrong.size;
 return `<section class="screen home-screen">
  <div class="section-title"><div><span>BUGÜN</span><h2>Çalışmaya başla</h2></div><button class="text-btn" onclick="go('bank')">Tümü</button></div>
  <button class="daily-test" onclick="startQuiz('daily')">
    <div class="daily-icon">${icon('play')}</div><div><small>SANA ÖZEL</small><h3>Günün Testi</h3><p>Zayıf olduğun maddelerden 10 soru</p></div><span>${icon('arrow')}</span>
    <div class="daily-meta"><b>10 Soru</b><b>8 dk</b><b>+120 XP</b></div>
  </button>
  <div class="quick-grid">
    <button onclick="startQuiz('quick')"><i>${icon('bolt')}</i><strong>Hızlı 10</strong><span>Karışık sorular</span></button>
    <button onclick="go('wrong')"><i class="red">${icon('wrong')}</i><strong>Yanlışlarım</strong><span>${wrongCount} soru bekliyor</span></button>
  </div>
  <div class="section-title compact"><div><span>ÖNERİLEN</span><h2>Kaldığın yerden devam et</h2></div></div>
  <article class="continue-card" onclick="openLaw()">
    <div class="law-badge">222</div><div class="continue-copy"><h3>İlköğretim ve Eğitim Kanunu</h3><p>84 / 320 soru çözüldü</p><div class="mini-progress"><i style="width:26%"></i></div><small>Son çalışma: Okula Devam</small></div><span>${icon('arrow')}</span>
  </article>
  <div class="section-title compact"><div><span>ANALİZ</span><h2>Zayıf konuların</h2></div><button class="text-btn" onclick="go('bank')">İncele</button></div>
  <div class="weak-list">
   <button onclick="startSection('attendance')"><span class="weak-rank danger">%48</span><div><strong>Okula Devam</strong><small>Madde 52–59 · 72 soru</small></div><em>Çalış</em></button>
   <button onclick="startSection('registration')"><span class="weak-rank warn">%61</span><div><strong>Kayıt ve Kabul</strong><small>Madde 46–51 · 44 soru</small></div><em>Çalış</em></button>
  </div>
 </section>`
}

function bankView(){
 return `<section class="screen"><div class="page-head"><button onclick="go('home')">‹</button><div><span>SORU BANKASI</span><h2>Çalışma alanları</h2></div></div>
 <article class="law-overview"><div class="law-badge large">222</div><div><small>MEB MEVZUATI</small><h3>${LAW.title}</h3><p>${LAW.stats.questions} soru · %${LAW.stats.correct} başarı</p></div></article>
 <div class="mode-grid">
  <button onclick="startQuiz('quick')"><i>${icon('bolt')}</i><strong>Hızlı Test</strong><span>10 karışık soru</span></button>

  <button onclick="go('wrong')"><i>${icon('wrong')}</i><strong>Yanlışlarım</strong><span>${state.wrong.size} soruyu tekrar et</span></button>
  <button onclick="go('laws')"><i>${icon('law')}</i><strong>Kanunu İncele</strong><span>Madde ve açıklamalar</span></button>
 </div>
 <div class="section-title compact"><div><span>BÖLÜMLER</span><h2>Madde bazlı sorular</h2></div></div>
 <div class="section-list">${LAW.sections.map((s,i)=>`<button onclick="startSection('${s.id}')"><b>${String(i+1).padStart(2,'0')}</b><div><strong>${s.title}</strong><small>${s.range} · ${s.questions} soru</small></div><span>${icon('arrow')}</span></button>`).join('')}</div>

function wrongView(){
 const wrongQs=QUESTIONS.filter(q=>state.wrong.has(q.id));
 return `<section class="screen"><div class="page-head"><button onclick="go('home')">‹</button><div><span>TEKRAR MODU</span><h2>Yanlışlarım</h2></div></div>
 ${wrongQs.length?`<div class="wrong-summary"><strong>${wrongQs.length}</strong><div><h3>Tekrar bekleyen soru</h3><p>Doğru cevapladıkça listeden çıkar.</p></div></div><button class="primary-btn" onclick="startQuiz('wrong')">Yanlışları Yeniden Çöz</button><div class="wrong-cards">${wrongQs.map(q=>`<button onclick="openArticle(${q.article})"><span>Madde ${q.article}</span><strong>${q.q}</strong><small>Maddeyi incele ${icon('arrow')}</small></button>`).join('')}</div>`:`<div class="empty-state"><i>${icon('check')}</i><h3>Harika, bekleyen yanlış yok!</h3><p>Yeni test çözdükçe yanlış yaptığın sorular burada toplanır.</p><button class="primary-btn" onclick="startQuiz('quick')">10 Soru Çöz</button></div>`}
 </section>`

function lawsView(){
 return `<section class="screen"><div class="page-head"><button onclick="go('home')">‹</button><div><span>AKILLI MEVZUAT</span><h2>222 sayılı Kanun</h2></div></div>
 <article class="law-reader-head"><div class="law-badge large">222</div><div><h3>${LAW.title}</h3><p>Yanlış yaptığın soruların dayandığı maddeleri öğren.</p></div></article>
 <div class="reader-note"><b>Nasıl kullanılır?</b><p>Önce soru çöz. Yanlış yaptığında ilgili maddenin sade anlatımına ve resmî metnine buradan ulaş.</p></div>
 <div class="article-list">${Object.entries(ARTICLES).map(([n,a])=>`<button onclick="openArticle(${n})"><span>Madde ${n}</span><div><strong>${a.title}</strong><small>${QUESTIONS.filter(q=>q.article==n).length} örnek soru</small></div><em>${icon('arrow')}</em></button>`).join('')}</div>
 </section>`
}

function startQuiz(mode){
 let pool=[];
 if(mode==='wrong') pool=QUESTIONS.filter(q=>state.wrong.has(q.id));
 else if(mode==='daily') pool=[...QUESTIONS].sort((a,b)=>(state.wrong.has(b.id)?1:0)-(state.wrong.has(a.id)?1:0)).slice(0,10);
 else pool=[...QUESTIONS].sort(()=>Math.random()-.5).slice(0,10);
 if(!pool.length){showToast('Tekrar edilecek yanlış soru bulunmuyor.');return}
 state.quiz=pool;state.index=0;state.answers=[];state.view='quiz';setNav('bank');render();
}
function startSection(id){const pool=QUESTIONS.filter(q=>q.section===id);if(!pool.length){showToast('Bu bölümün demo soruları henüz eklenmedi.');return}state.quiz=pool;state.index=0;state.answers=[];state.view='quiz';state.selectedSection=id;setNav('bank');render()}

function quizView(){
 const q=state.quiz[state.index]; const answered=state.answers[state.index];
 const progress=((state.index+1)/state.quiz.length)*100;
 return `<section class="quiz-screen">
  <div class="quiz-top"><button onclick="confirmExit()">×</button><div><span>SORU ${state.index+1} / ${state.quiz.length}</span><div class="quiz-progress"><i style="width:${progress}%"></i></div></div><button onclick="toggleBookmark(${q.id})">☆</button></div>
  <div class="quiz-meta"><span>222 Sayılı Kanun</span><b>Madde ${q.article}</b></div>
  <h2 class="question">${q.q}</h2>
  <div class="choices">${q.choices.map((c,i)=>{let cls='';if(answered!==undefined){if(i===q.answer)cls='correct';else if(i===answered)cls='wrong'}return `<button class="${cls}" ${answered!==undefined?'disabled':''} onclick="answer(${i})"><b>${String.fromCharCode(65+i)}</b><span>${c}</span><i>${cls==='correct'?'✓':cls==='wrong'?'×':''}</i></button>`}).join('')}</div>
  ${answered!==undefined?`<div class="explanation ${answered===q.answer?'ok':'bad'}"><div><b>${answered===q.answer?'Doğru cevap!':'Doğru cevap: '+String.fromCharCode(65+q.answer)}</b><span>Madde ${q.article}</span></div><p>${q.explain}</p><button onclick="openArticle(${q.article},true)">İlgili Maddeyi İncele ${icon('arrow')}</button></div>`:''}
  <div class="quiz-actions">${answered===undefined?'<span>Bir cevap seç</span>':`<button class="primary-btn" onclick="nextQuestion()">${state.index===state.quiz.length-1?'Testi Bitir':'Sonraki Soru'} ${icon('arrow')}</button>`}</div>
 </section>`
}

function answer(i){
 const q=state.quiz[state.index];state.answers[state.index]=i;
 if(i===q.answer) state.wrong.delete(q.id); else state.wrong.add(q.id);
 saveWrong();render();
}
function nextQuestion(){if(state.index<state.quiz.length-1){state.index++;render();app.scrollTop=0}else{state.view='result';render();app.scrollTop=0}}
function confirmExit(){if(confirm('Testten çıkmak istediğine emin misin?'))go('home')}
function toggleBookmark(){showToast('Soru kaydedildi.')}

function resultView(){
 const correct=state.quiz.reduce((n,q,i)=>n+(state.answers[i]===q.answer),0); const wrong=state.quiz.length-correct; const score=Math.round(correct/state.quiz.length*100);
 return `<section class="screen result-screen"><div class="result-hero"><div class="score-ring" style="--score:${score}"><span>%${score}</span><small>Başarı</small></div><h2>${score>=70?'Harika gidiyorsun!':'Bir tekrar daha iyi olacak'}</h2><p>Her yanlış, hangi maddeyi çalışman gerektiğini gösterir.</p></div>
 <div class="result-stats"><div><strong>${correct}</strong><span>Doğru</span></div><div><strong>${wrong}</strong><span>Yanlış</span></div><div><strong>${state.quiz.length}</strong><span>Toplam</span></div></div>
 <div class="result-actions"><button class="primary-btn" onclick="go('wrong')">Yanlışları İncele</button><button class="secondary-btn" onclick="go('home')">Ana Sayfaya Dön</button></div>
 ${wrong?`<div class="section-title compact"><div><span>ÖNERİ</span><h2>Tekrar etmen gereken maddeler</h2></div></div><div class="review-list">${[...new Set(state.quiz.filter((q,i)=>state.answers[i]!==q.answer).map(q=>q.article))].map(n=>`<button onclick="openArticle(${n})"><span>Madde ${n}</span><strong>${ARTICLES[n]?.title||'İlgili hüküm'}</strong><em>${icon('arrow')}</em></button>`).join('')}</div>`:''}
 </section>`
}

function openLaw(){go('bank')}
function openArticle(number,fromQuiz=false){state.article=Number(number);state.articleTab='summary';state.returnToQuiz=fromQuiz;state.view='article';render();app.scrollTop=0}
function articleView(){
 const n=state.article,a=ARTICLES[n]; if(!a)return lawsView();
 const content=state.articleTab==='summary'?`<div class="article-content"><h3>Sade anlatım</h3><p class="lead">${a.summary}</p><div class="key-box"><b>Sınavda dikkat</b>${a.points.map(p=>`<p>✓ ${p}</p>`).join('')}</div></div>`:state.articleTab==='official'?`<div class="article-content"><h3>Resmî metin</h3><p class="official-text">${a.official}</p><small class="source-note">Kanun metnindeki yazım biçimi sadeleştirilmeden anlam korunarak gösterilmiştir.</small></div>`:`<div class="article-content"><h3>Kritik noktalar</h3><div class="point-list">${a.points.map((p,i)=>`<div><b>${i+1}</b><p>${p}</p></div>`).join('')}</div></div>`;
 return `<section class="screen article-screen"><div class="page-head"><button onclick="articleBack()">‹</button><div><span>222 SAYILI KANUN</span><h2>Madde ${n}</h2></div></div>
 <article class="article-title-card"><span>Madde ${n}</span><h3>${a.title}</h3><p>${QUESTIONS.filter(q=>q.article===n).length} bağlantılı örnek soru</p></article>
 <div class="tabs"><button class="${state.articleTab==='summary'?'active':''}" onclick="setArticleTab('summary')">Sade Anlatım</button><button class="${state.articleTab==='official'?'active':''}" onclick="setArticleTab('official')">Resmî Metin</button><button class="${state.articleTab==='points'?'active':''}" onclick="setArticleTab('points')">Kritik Noktalar</button></div>
 ${content}
 <button class="primary-btn full" onclick="startArticleQuestions(${n})">Bu Maddeden Soru Çöz</button>
 </section>`
}
function setArticleTab(t){state.articleTab=t;render()}
function articleBack(){if(state.returnToQuiz){state.view='quiz';state.returnToQuiz=false;render()}else go('laws')}
function startArticleQuestions(n){const pool=QUESTIONS.filter(q=>q.article===n);if(!pool.length){showToast('Bu madde için demo sorusu bulunmuyor.');return}state.quiz=pool;state.index=0;state.answers=[];state.view='quiz';render()}

function profileView(){return `<section class="screen"><div class="page-head"><button onclick="go('home')">‹</button><div><span>HESABIM</span><h2>Profil</h2></div></div><div class="empty-state"><i>👤</i><h3>Profil ekranı</h3><p>Demo sürümde çalışma istatistikleri ana sayfada gösteriliyor.</p></div></section>`}

function render(){
 const views={home:homeView,bank:bankView,wrong:wrongView,laws:lawsView,quiz:quizView,result:resultView,article:articleView,profile:profileView};
 app.innerHTML=(views[state.view]||homeView)();
 document.querySelector('.app-header').classList.toggle('hidden',['quiz','article','result','bank','wrong','laws','profile'].includes(state.view));
 document.querySelector('.bottom-nav').classList.toggle('hidden',state.view==='quiz'||state.view==='article');
}

navButtons.forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
render();
</script>
</body>
</html>
