<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SınavRotası — Akıllı Soru Bankası</title>
  <style>
    :root{--navy:#071f49;--navy2:#123b77;--blue:#2d7ef7;--red:#e93238;--red2:#fff0f1;--green:#1f9d62;--green2:#eaf8f0;--amber:#d99019;--text:#10213f;--muted:#778196;--line:#e7ebf1;--bg:#f5f7fb;--white:#fff;--shadow:0 12px 32px rgba(13,33,68,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:#e5eaf1}button{font:inherit}body{display:grid;place-items:center;min-height:100vh;padding:24px}.phone{width:min(390px,calc((100vh - 48px)*9/16));aspect-ratio:9/16;max-height:calc(100vh - 48px);position:relative;overflow:hidden;border:9px solid #101828;border-radius:42px;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.22)}
    
    .app-header{position:relative;z-index:10;color:#fff;background:radial-gradient(circle at 82% 10%,rgba(68,126,205,.38),transparent 36%),linear-gradient(155deg,#061a3c,#0a2f67 76%,#082651);padding:18px 18px 20px;border-radius:0 0 30px 30px}
    .app-header.hidden{display:none}.statusbar{display:flex;justify-content:space-between;padding:0 7px 15px;font-size:13px;font-weight:800}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow,.section-title span,.page-head span{margin:0 0 4px;font-size:8px;letter-spacing:1.15px;font-weight:900;color:#ff6d70}.topbar h1{font-size:20px;margin:0 0 5px}.topbar p:last-child{font-size:11.5px;color:rgba(255,255,255,.76);margin:0}.round-btn{width:44px;height:44px;border:0;border-radius:15px;background:rgba(255,255,255,.09);color:#fff;position:relative}.round-btn b{position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:9px}.goal-card{margin-top:16px;padding:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:19px;display:grid;grid-template-columns:70px 1fr;gap:13px;align-items:center}.goal-ring{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at center,#0b2d63 57%,transparent 58%),conic-gradient(var(--red) 65%,rgba(255,255,255,.12) 0)}.goal-ring span{font-size:17px;font-weight:900}.goal-ring small{font-size:8px;color:rgba(255,255,255,.72)}.goal-line{display:flex;justify-content:space-between;gap:8px;font-size:10px}.goal-line span{color:#ff797c}.progress,.mini-progress,.quiz-progress{height:6px;border-radius:99px;overflow:hidden;background:#e7ebf1}.goal-card .progress{margin:9px 0;background:rgba(255,255,255,.14)}.progress i,.mini-progress i,.quiz-progress i{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#6ba8ff)}.goal-card .progress i{background:linear-gradient(90deg,#ff6c6f,var(--red))}.goal-copy p{font-size:9.5px;color:rgba(255,255,255,.7);margin:0}
    
    .scroll-area{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
    .scroll-area::-webkit-scrollbar{display:none}
    .app-scroll{padding-bottom:94px}
    .screen{padding:18px 17px 28px}
    .home-screen{padding-top:16px}
    
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
    .stat{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;border:1px solid var(--line);box-shadow:0 4px 10px rgba(13,33,68,.03)}
    .stat-icon{width:28px;height:28px;margin:0 auto 6px;border-radius:8px;background:#edf3fb;color:var(--navy2);display:grid;place-items:center}
    .stat-icon.accent{background:var(--red2);color:var(--red)}
    .stat-icon svg{width:16px;height:16px}
    .stat strong{display:block;font-size:15px;color:var(--text);margin-bottom:2px}
    .stat span{display:block;font-size:8.5px;color:var(--muted);line-height:1.2}

    .section-title{display:flex;align-items:flex-end;justify-content:space-between;margin:0 2px 11px}.section-title.compact{margin-top:20px}.section-title h2{font-size:17px;margin:0}.text-btn{border:0;background:none;color:var(--red);font-size:11px;font-weight:800}.daily-test{width:100%;border:0;border-radius:21px;color:#fff;background:radial-gradient(circle at 86% 6%,rgba(65,121,201,.4),transparent 35%),linear-gradient(145deg,#082a60,#061b40);display:grid;grid-template-columns:48px 1fr 18px;gap:11px;text-align:left;align-items:center;padding:16px;box-shadow:0 14px 30px rgba(7,31,73,.22)}.daily-icon{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.1);display:grid;place-items:center}.daily-test small{font-size:8px;color:#ff7779;font-weight:900;letter-spacing:1px}.daily-test h3{margin:3px 0;font-size:17px}.daily-test p{margin:0;color:rgba(255,255,255,.7);font-size:10.5px}.daily-meta{grid-column:1/-1;display:flex;gap:7px;margin-top:5px}.daily-meta b{font-size:9px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}.quick-grid,.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.quick-grid button,.mode-grid button{border:1px solid #ebedf2;border-radius:17px;background:#fff;padding:14px;text-align:left;box-shadow:0 8px 20px rgba(12,32,65,.055)}.quick-grid i,.mode-grid i{width:35px;height:35px;border-radius:11px;background:#edf3fc;color:var(--navy2);display:grid;place-items:center;font-style:normal;margin-bottom:9px}.quick-grid i.red{background:var(--red2);color:var(--red)}.quick-grid strong,.mode-grid strong{display:block;font-size:13px}.quick-grid span,.mode-grid span{display:block;font-size:9.5px;color:var(--muted);margin-top:4px}.continue-card{display:grid;grid-template-columns:49px 1fr 16px;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow)}.law-badge{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#f64b50,#d9252b);color:#fff;display:grid;place-items:center;font-weight:900}.continue-copy h3{font-size:12px;margin:0 0 4px}.continue-copy p,.continue-copy small{font-size:9px;color:var(--muted);margin:0}.mini-progress{margin:8px 0 5px;height:5px}.weak-list{display:flex;flex-direction:column;gap:9px}.weak-list button{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:11px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left}.weak-rank{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:900}.weak-rank.danger{background:var(--red2);color:var(--red)}.weak-rank.warn{background:#fff5e6;color:var(--amber)}.weak-list strong{font-size:11.5px;display:block}.weak-list small{font-size:9px;color:var(--muted)}.weak-list em{font-style:normal;color:var(--red);font-size:10px;font-weight:800}

    /* KATEGORİ LİSTESİ CSS'i (Kullanıcının Orijinal Koduna Uyarlanmış) */
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:20px 2px 11px}
    .section-head h3{font-size:17px;margin:0}
    .section-head a{font-size:11px;color:var(--red);text-decoration:none;font-weight:800;display:flex;align-items:center}
    .categories{display:flex;flex-direction:column;gap:10px}
    .category{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;display:grid;grid-template-columns:42px 1fr 20px;gap:12px;align-items:center;box-shadow:0 4px 10px rgba(13,33,68,.02);cursor:pointer}
    .cat-icon{width:42px;height:42px;border-radius:12px;background:#edf3fb;color:var(--navy2);display:grid;place-items:center}
    .cat-icon svg{width:20px;height:20px}
    .cat-icon.blue{background:#edf3fb;color:var(--blue)}
    .cat-icon.red{background:var(--red2);color:var(--red)}
    .cat-copy h4{margin:0 0 3px;font-size:13px;color:var(--text)}
    .cat-copy p{margin:0 0 4px;font-size:9.5px;line-height:1.4;color:var(--muted)}
    .cat-copy small{font-size:8.5px;color:var(--navy2);font-weight:600}
    .chevron{color:var(--muted);display:grid;place-items:center}
    .chevron svg{width:18px;height:18px}

    /* KULLANICININ BOTTOM SHEET VE TOPIC CSS'İ (Arayüz Uyumu İçin) */
    .topic-backdrop { position:absolute; inset:0; background:rgba(7,31,73,0.4); opacity:0; pointer-events:none; transition:0.3s; z-index:100; backdrop-filter:blur(3px); }
    .topic-backdrop.open { opacity:1; pointer-events:auto; }
    .topic-sheet { position:absolute; bottom:0; left:0; right:0; background:#fff; border-radius:32px 32px 0 0; padding:24px 20px; transform:translateY(100%); transition:0.35s cubic-bezier(0.3, 0.9, 0.4, 1); z-index:110; max-height:88%; display:flex; flex-direction:column; box-shadow:0 -20px 40px rgba(0,0,0,0.15); }
    .topic-sheet.open { transform:translateY(0); }
    .topic-handle { width:44px; height:5px; background:#d0d6e0; border-radius:10px; margin:0 auto 20px; }
    .topic-sheet-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; flex-shrink:0; }
    .topic-heading-wrap { display:flex; gap:12px; align-items:center; }
    .topic-heading-icon { width:44px; height:44px; border-radius:14px; background:#edf3fb; color:var(--blue); display:grid; place-items:center; }
    .topic-heading-icon.red { background:var(--red2); color:var(--red); }
    .topic-heading-icon.blue { background:#edf3fb; color:var(--blue); }
    .topic-heading-icon svg { width:24px; height:24px; }
    .topic-eyebrow { font-size:9px; font-weight:800; color:var(--red); letter-spacing:1px; display:block; margin-bottom:4px; }
    #topicSheetTitle { margin:0 0 4px; font-size:18px; color:var(--navy); line-height:1.2; }
    #topicSheetSubtitle { margin:0; font-size:11px; color:var(--muted); }
    .topic-close { width:32px; height:32px; border-radius:50%; border:0; background:#f0f4f8; color:var(--navy); font-size:18px; display:grid; place-items:center; cursor:pointer; flex-shrink:0; }
    
    .topic-progress-card { background:#f8f9fc; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:16px; flex-shrink:0; }
    .topic-progress-card > div:first-child { display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px; font-weight:600; color:var(--navy2); }
    .topic-progress-track { height:6px; background:#e7ebf1; border-radius:10px; overflow:hidden; }
    #topicProgressBar { display:block; height:100%; background:var(--green); border-radius:10px; transition:0.4s; }
    
    .topic-list { display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding-bottom:40px; scrollbar-width:none; }
    .topic-list::-webkit-scrollbar { display:none; }
    .topic-item { display:grid; grid-template-columns:36px 1fr auto 18px; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:16px; background:#fff; cursor:pointer; }
    .topic-number { width:32px; height:32px; border-radius:10px; background:#f0f4f8; display:grid; place-items:center; font-size:11px; font-weight:800; color:var(--navy2); }
    .topic-item.completed .topic-number { background:var(--green2); color:var(--green); }
    .topic-copy h4 { margin:0 0 4px; font-size:13px; color:var(--navy); }
    .topic-copy p { margin:0; font-size:10px; color:var(--muted); }
    .article-range { display:inline-block; font-size:9px; background:var(--red2); color:var(--red); padding:3px 6px; border-radius:6px; font-weight:700; margin-bottom:4px; }
    .topic-count-pill { font-size:10px; font-weight:700; padding:4px 8px; background:#f0f4f8; color:var(--navy2); border-radius:10px; }
    .topic-arrow { color:#aab2c0; display:grid; place-items:center; }
    .topic-arrow svg { width:16px; height:16px; }
    .topic-breadcrumb { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; color:var(--blue); margin-bottom:16px; cursor:pointer; padding:8px 12px; background:#edf3fb; border-radius:10px; width:fit-content; flex-shrink:0; }
    .topic-breadcrumb svg { width:14px; height:14px; }

    /* Belge Görünümü CSS (Document Hub) */
    .document-overview-card { background:linear-gradient(145deg,#082b63,#071d42); color:#fff; border-radius:18px; padding:18px; margin-bottom:16px; }
    .document-overview-top { display:flex; justify-content:space-between; margin-bottom:12px; }
    .document-number { background:var(--red); color:#fff; font-size:11px; font-weight:800; padding:4px 8px; border-radius:8px; }
    .document-status { font-size:9px; color:#ff7a7d; font-weight:800; letter-spacing:1px; }
    .document-overview-card h4 { margin:0 0 6px; font-size:16px; }
    .document-overview-card p { margin:0 0 16px; font-size:10px; color:rgba(255,255,255,0.7); line-height:1.4; }
    .document-stats { display:flex; gap:16px; border-top:1px solid rgba(255,255,255,0.1); padding-top:12px; font-size:10px; color:rgba(255,255,255,0.8); }
    .document-stats strong { color:#fff; font-size:12px; display:block; margin-bottom:2px; }
    .document-mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
    .document-mode-card { border:1px solid var(--line); border-radius:16px; background:#fff; padding:14px; text-align:left; cursor:pointer; }
    .document-mode-card.primary { background:#f5f8fc; border-color:#d4e2f4; }
    .document-mode-icon { display:inline-block; width:28px; height:28px; border-radius:8px; background:var(--red2); color:var(--red); text-align:center; line-height:28px; font-weight:900; margin-bottom:8px; }
    .document-mode-card.primary .document-mode-icon { background:var(--blue); color:#fff; }
    .document-mode-card strong { display:block; font-size:12px; color:var(--navy); margin-bottom:4px; }
    .document-mode-card small { display:block; font-size:9px; color:var(--muted); line-height:1.3; }
    .document-section-head { margin-bottom:12px; font-size:11px; color:var(--muted); }
    .document-section-head strong { color:var(--navy); font-size:14px; display:block; margin-top:2px; }
    .document-section-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
    .document-section-number { font-size:12px; font-weight:800; color:var(--blue); width:24px; }
    .document-section-item h4 { margin:0 0 3px; font-size:13px; color:var(--navy); }
    .document-section-item p { margin:0; font-size:10px; color:var(--muted); }
    .document-section-arrow { margin-left:auto; font-size:18px; color:var(--muted); }

    /* Swiper / Article Reader CSS */
    .article-reader { padding-bottom: 20px; }
    .reader-hero { margin-bottom:16px; }
    .article-kicker { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .article-label { font-size:11px; font-weight:800; color:var(--red); background:var(--red2); padding:4px 8px; border-radius:8px; }
    .article-status { font-size:9px; font-weight:800; color:var(--muted); }
    .reader-hero h4 { margin:0 0 6px; font-size:16px; color:var(--navy); line-height:1.3; }
    .reader-hero p { margin:0; font-size:10.5px; color:var(--muted); line-height:1.5; }
    .reader-tabs { display:flex; gap:6px; background:#f0f4f8; padding:4px; border-radius:12px; margin-bottom:16px; }
    .reader-tab { flex:1; padding:8px 4px; border:0; background:none; font-size:10px; font-weight:700; color:var(--muted); border-radius:8px; cursor:pointer; }
    .reader-tab.active { background:#fff; color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .reader-panel { display:none; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
    .reader-panel.active { display:block; }
    .reader-card-label { font-size:9px; font-weight:800; color:var(--navy2); display:block; margin-bottom:8px; }
    .reader-panel p { font-size:11.5px; line-height:1.6; color:var(--text); margin:0; }
    .reader-info { margin-top:12px; font-size:9px; color:var(--muted); background:#f8f9fc; padding:10px; border-radius:10px; }
    .official-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
    .official-toolbar strong { font-size:11px; color:var(--navy); }
    .official-toolbar button { background:none; border:1px solid var(--line); padding:4px 8px; border-radius:6px; font-size:12px; font-weight:700; color:var(--navy); cursor:pointer; }
    .official-section { margin-bottom:16px; }
    .official-section span { display:block; font-size:10px; font-weight:800; color:var(--blue); margin-bottom:4px; }
    .article-points { margin:0; padding-left:16px; font-size:11.5px; line-height:1.5; color:var(--text); }
    .article-points li { margin-bottom:8px; }
    .reader-actions { display:flex; gap:10px; }
    .reader-primary, .reader-secondary { flex:1; border:0; border-radius:14px; padding:14px; font-size:12px; font-weight:800; cursor:pointer; }
    .reader-primary { background:var(--blue); color:#fff; }
    .reader-primary.done { background:var(--green); }
    .reader-secondary { background:#f0f4f8; color:var(--navy); }

    /* Quiz, Misc */
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 6px 17px;z-index:20;backdrop-filter:blur(12px)}.bottom-nav.hidden{display:none}.bottom-nav button{border:0;background:none;color:#788295;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom-nav button span{font-size:8px}.bottom-nav button.active{color:var(--red);font-weight:850}.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,18px);background:#071f49;color:#fff;padding:10px 14px;border-radius:11px;font-size:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    
    @media(max-width:430px){
      body{padding:0;background:var(--bg)}
      .phone{width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
      .app-header{padding-top:max(16px,env(safe-area-inset-top))}
      .bottom-nav{height:calc(74px + env(safe-area-inset-bottom));padding-bottom:calc(9px + env(safe-area-inset-bottom))}
      .app-scroll{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
  <div class="phone">
    
    <div class="scroll-area" id="scroll-area">
      <header class="app-header">
        <div class="statusbar"><span>9:41</span><span>▮▮▮  ◉  ▰</span></div>
        <div class="topbar">
          <div>
            <p class="eyebrow">SINAVROTASI</p>
            <h1>Merhaba, Ahmet 👋</h1>
            <p>Bugünkü hedefin için 35 soru kaldı.</p>
          </div>
          <button class="round-btn" aria-label="Bildirimler">🔔<b>3</b></button>
        </div>
        <div class="goal-card">
          <div class="goal-ring"><span>%65</span><small>Günlük</small></div>
          <div class="goal-copy">
            <div class="goal-line"><strong>65 / 100 soru</strong><span>7 gün seri 🔥</span></div>
            <div class="progress"><i style="width:65%"></i></div>
            <p>İstikrarlı devam et, hedefin çok yakın.</p>
          </div>
        </div>
      </header>

      <main id="app" class="app-scroll"></main>
    </div>

    <nav class="bottom-nav" aria-label="Ana menü">
      <button data-nav="home" class="active">⌂<span>Ana Sayfa</span></button>
      <button data-nav="bank">▦<span>Soru Bankası</span></button>
      <button data-nav="wrong">✕<span>Yanlışlarım</span></button>
      <button data-nav="laws">§<span>Mevzuat</span></button>
      <button data-nav="profile">○<span>Profil</span></button>
    </nav>

    <div id="toast" class="toast"></div>

    <!-- KULLANICININ İSTEDİĞİ ASIL AÇILIR EKRAN (BOTTOM SHEET) YAPISI -->
    <div class="topic-backdrop" id="topicBackdrop"></div>
    <section class="topic-sheet" id="topicSheet" aria-hidden="true" aria-label="Konu başlıkları">
      <div class="topic-handle"></div>
      <div class="topic-sheet-head">
        <div class="topic-heading-wrap">
          <div class="topic-heading-icon" id="topicHeadingIcon"></div>
          <div>
            <span class="topic-eyebrow" id="topicEyebrow">KONU KATEGORİSİ</span>
            <h3 id="topicSheetTitle">Genel Mevzuat</h3>
            <p id="topicSheetSubtitle">Çalışmak istediğin başlığı seç.</p>
          </div>
        </div>
        <button class="topic-close" id="closeTopicSheet" type="button" aria-label="Konu panelini kapat">×</button>
      </div>
      <div id="topicBreadcrumbWrap"></div>
      <div class="topic-progress-card">
        <div>
          <span>Kategori ilerlemesi</span>
          <strong id="topicProgressText">%0 tamamlandı</strong>
        </div>
        <div class="topic-progress-track">
          <span id="topicProgressBar"></span>
        </div>
      </div>
      <div class="topic-list" id="topicList"></div>
    </section>

  </div>

<script>
// ============================================================================
// 1. BASİT ANA SAYFA VE DİĞER MENÜLER İÇİN YÖNLENDİRME (ROUTER)
// ============================================================================
const state = {

          if (item.type === 'document') {
            renderDocumentHub(item, currentLevel);
          } else {
            const articleGroup = isArticleCardGroup(item);
            navStack.push({
              title: item.title,
              subtitle: `${item.children.length} alt başlık`,
              icon: 'gavel',
              iconClass: currentLevel.iconClass,
              eyebrow: articleGroup ? 'MADDE LİSTESİ' : 'ALT KONULAR',
              topics: item.children,
              progress: 0,
              documentTitle: currentLevel.documentTitle
            });
            renderLevel(navStack[navStack.length - 1]);
          }
        } else if (item.articleLabel) {
          renderArticleDetail(item);
        } else {
          showToast(`${item.title} açılıyor…`);
        }
      });
    });
  }

  function renderArticleDetail(item) {
    topicSheetTitle.textContent = item.title;
    topicSheetSubtitle.textContent = `${item.articleLabel} • SınavRotası`;
    topicEyebrow.textContent = 'MADDE OKUYUCU';
    topicHeadingIcon.innerHTML = topicSvg('gavel');

    const parentLevel = navStack[navStack.length - 1];
    topicBreadcrumbWrap.innerHTML = `
      <div class="topic-breadcrumb" id="articleBackBtn">
        ${topicSvg('back')}
        <span>${parentLevel.title}</span>
      </div>
    `;
    document.getElementById('articleBackBtn').addEventListener('click', () => renderLevel(parentLevel));

    const completed = isArticleCompleted(item, parentLevel.documentTitle);
    topicProgressText.textContent = completed ? 'Tamamlandı' : 'Okunmayı bekliyor';
    topicProgressBar.style.width = completed ? '100%' : '0%';

    const officialText = item.officialText?.sections?.[0]?.text || 'Resmi metin hazırlanıyor.';
    const keyPoints = item.keyPoints || ['Sınav için detaylı analiz eklenecektir.'];

    topicList.innerHTML = `
      <div class="article-reader">
        <section class="reader-hero">
          <div class="article-kicker">
            <span class="article-label">${item.articleLabel}</span>
            <span class="article-status">OKUMA EKRANI</span>
          </div>
          <h4>${item.title}</h4>
        </section>

        <div class="reader-tabs">
          <button class="reader-tab active" data-tab="summary">Sade Anlatım</button>
          <button class="reader-tab" data-tab="official">Resmî Metin</button>
          <button class="reader-tab" data-tab="points">Kritik Noktalar</button>
        </div>

        <section class="reader-panel active" data-panel="summary">
          <span class="reader-card-label">KISA ÖZET</span>
          <p>${item.summary || 'Özet hazırlanıyor.'}</p>
        </section>

        <section class="reader-panel" data-panel="official">
          <div class="official-toolbar"><strong>Eksiksiz kanun metni</strong></div>
          <p>${officialText}</p>
        </section>

        <section class="reader-panel" data-panel="points">
          <span class="reader-card-label">SINAV ODAKLI NOTLAR</span>
          <ul class="article-points">${keyPoints.map(p => `<li>${p}</li>`).join('')}</ul>
        </section>

        <div class="reader-actions">
          <button class="reader-secondary" onclick="showToast('Madde soruları yükleniyor')">Madde Soruları</button>
          <button class="reader-primary ${completed ? 'done' : ''}" id="articleCompleteBtn">
            ${completed ? '✓ Tamamlandı' : 'Tamamlandı İşaretle'}
          </button>
        </div>
      </div>
    `;

    document.querySelectorAll('.reader-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.reader-tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.reader-panel').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        topicList.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
      });
    });

    document.getElementById('articleCompleteBtn').addEventListener('click', () => {
      const isDone = isArticleCompleted(item, parentLevel.documentTitle);
      setArticleCompleted(item, !isDone, parentLevel.documentTitle);
      renderArticleDetail(item);
    });
  }

  window.openTopicSheet = function(categoryKey) {
    const category = categoryTopics[categoryKey];
    if (!category) {
      showToast('Kategori bulunamadı.');
      return;
    }
    navStack = [{
      title: category.title,
      subtitle: category.subtitle,
      icon: category.icon,
      iconClass: category.iconClass,
      eyebrow: 'KONU KATEGORİSİ',
      topics: category.topics,
      progress: category.progress
    }];
    renderLevel(navStack[0]);
    topicSheet.classList.add('open');
    topicBackdrop.classList.add('open');
  };

  function closeTopicSheet() {
    topicSheet.classList.remove('open');
    topicBackdrop.classList.remove('open');
  }

  closeTopicSheetButton.addEventListener('click', closeTopicSheet);
  topicBackdrop.addEventListener('click', closeTopicSheet);

})();
</script>
</body>
</html>
